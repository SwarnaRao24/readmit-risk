[project]
name = "readmit-risk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swarna Rao", email = "chintal1@uwindsor.ca" }
]
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
]

[project.scripts]
readmit-risk = "readmit_risk:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
